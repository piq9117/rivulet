name: Test
on:
  push:
    branches:
      - master

  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        node-version: [latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 
        uses: actions/setup-node$v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
        - run: npm ci
        - run: npm test

